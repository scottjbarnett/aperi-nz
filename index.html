<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aperi</title>
  <style>
    :root {
      --ink: #18201f;
      --muted: #5f6864;
      --paper: #f7f4ee;
      --line: #d9d1c4;
      --accent: #8a6f3d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    main {
      width: 100%;
      max-width: 760px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 72px 0;
    }

    .mark {
      width: 84px;
      height: 84px;
      margin-bottom: 42px;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 0.9;
      letter-spacing: -0.07em;
      margin: 0 0 32px;
      font-weight: 500;
    }

    h2 {
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
      max-width: 620px;
      margin: 0 0 24px;
      font-weight: 500;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.7;
      max-width: 620px;
      color: var(--muted);
      margin: 0 0 20px;
    }

    a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--accent);
    }

    .contact {
      margin-top: 36px;
      color: var(--ink);
    }

    .brand-line {
      margin-top: 56px;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <main>
    <svg class="mark" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="58" cy="58" r="42" fill="none" stroke="#18201f" stroke-width="5" stroke-dasharray="210 80" stroke-linecap="round"/>
      <circle cx="88" cy="78" r="5" fill="#8a6f3d"/>
      <path d="M88 78 L108 96" stroke="#8a6f3d" stroke-width="4" stroke-linecap="round"/>
    </svg>

    <h1>Aperi</h1>

    <h2>At the early edge of complex projects</h2>

    <p>Research, systems thinking, and applied intelligence.</p>

    <p>Current areas of interest include energy resilience, fertiliser sovereignty, and regional development.</p>

    <p class="contact">
      Contact: <a href="mailto:info@aperi.nz">info@aperi.nz</a>
    </p>

    <div class="brand-line">Aperi · New Zealand</div>
  </main>
</body>
</html>
